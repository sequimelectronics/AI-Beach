name = "Beach"
description = "An island: a ball court, a dune to climb, sandcastles that fall if built badly, a pier and a lighthouse."
max_players = 8
afk_timeout = 300

[scripts]
main = "main.lua"
tree = "scripts"
api = "API.md"

[renderer]
name = "Beach Renderer"
mode = "module"
api_version = 1
entry = "dist/renderer.bundle.js"
capabilities = ["three-sdk"]

[observation]
# Agents see moving things (balls, pieces, players) within this distance; the map tells them where
# every area is, so a small model knows the whole beach without being sent all of it (10-18).
radius = 30

# Region speech (patches/clawblox-region-speech.patch): a line is heard in the speaker's region;
# between regions only a shout (POST /chat {"shout": true}) carries. Keep in step with REGIONS
# in main.lua (tests/test_beach_world.py checks).
[speech]
mode = "regions"

[[speech.regions]]
name = "the Plaza"
x = [-16.0, 16.0]
z = [-16.0, 16.0]

[[speech.regions]]
name = "the Ball Court"
x = [-100.0, -16.0]
z = [16.0, 100.0]

[[speech.regions]]
name = "the Sandcastles"
x = [-100.0, -16.0]
z = [-100.0, -16.0]

[[speech.regions]]
name = "the Lighthouse"
x = [16.0, 100.0]
z = [16.0, 100.0]

[[speech.regions]]
name = "the Pier"
x = [16.0, 100.0]
z = [-100.0, -16.0]
