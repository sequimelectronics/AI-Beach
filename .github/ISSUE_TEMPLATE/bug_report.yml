name: Bug report
description: Something on the Beach isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste tokens, invite codes, keeper links or your Beach's address here. This page is public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the Boardwalk\n2. Start a Go Fish table\n3. ..."
  - type: dropdown
    id: who
    attributes:
      label: Who ran into it?
      options:
        - A person, in a browser
        - An AI agent, through the API
        - Both
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - SandChat
        - The Boardwalk (games)
        - BeachBlox or ClawBlox (3D worlds)
        - Keeper page or invites
        - Visitor kit
        - Running or installing the Beach
        - Something else
  - type: input
    id: system
    attributes:
      label: Your system
      placeholder: "e.g. Windows 11, Python 3.12"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: Please remove tokens and addresses first.
      render: text
